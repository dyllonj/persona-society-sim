<svg xmlns="http://www.w3.org/2000/svg" width="900" height="778" viewBox="0 0 900 778" role="img" aria-labelledby="title desc">
<title id="title">Agents pool evidence when together but never go looking for teammates</title>
<desc id="desc">Same room: mean 100% over 15 instances; Same room, a teammate drops out: mean 82% over 15 instances; …plus a share-first norm: mean 53% over 15 instances; Separate rooms: mean 9% over 15 instances; Separate rooms, 5 rounds: mean 7% over 15 instances; Separate rooms, occupants visible: mean 9% over 15 instances; No communication: mean 8% over 15 instances</desc>
<style>
  .bg { fill: #fffff8; }
  .t { font-family: "ET Book", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; fill: #111; }
  .title { font-size: 21px; }
  .sub { font-size: 14px; fill: #666; }
  .label { font-size: 15px; }
  .value { font-size: 14px; fill: #111; paint-order: stroke; stroke: #fffff8; stroke-width: 5px; stroke-linejoin: round; }
  .note { font-size: 13px; fill: #666; }
  .tick { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #777; }
  .axis { stroke: #bbb; stroke-width: 1; }
  .ref { stroke: #999; stroke-width: 1; stroke-dasharray: 4 4; }
  .dot { fill: #666; fill-opacity: 0.55; }
  .dot-hi { fill: #c0392b; fill-opacity: 0.6; }
  .mean { stroke: #111; stroke-width: 2.5; }
  .mean-hi { stroke: #c0392b; stroke-width: 2.5; }
  .ci { stroke: #111; stroke-width: 1.2; }
  .bar { fill: #7a7a7a; }
  .bar-hi { fill: #c0392b; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #151515; }
    .t, .value { fill: #ddd; }
    .value { stroke: #151515; }
    .sub, .note { fill: #999; }
    .tick { fill: #888; }
    .axis { stroke: #555; }
    .ref { stroke: #777; }
    .dot { fill: #999; }
    .dot-hi { fill: #fc8d62; }
    .mean, .ci { stroke: #ddd; }
    .mean-hi { stroke: #fc8d62; }
    .bar { fill: #888; }
    .bar-hi { fill: #fc8d62; }
  }
</style>
<rect class="bg" width="900" height="778"/>
<text class="t title" x="24" y="38">Agents pool evidence when together but never go looking for teammates</text>
<text class="t sub" x="24" y="62">Qwen3-8B 4-bit, the same 15 task instances in every row; dot = instance, bar = mean, line = 95% CI</text>
<text class="t label" x="234" y="143.0" text-anchor="end">Same room</text>
<line class="ci" x1="840.0" x2="840.0" y1="138.0" y2="138.0"/>
<circle class="dot-hi" cx="840.0" cy="138.0" r="7.1"/>
<text class="tick" x="840.0" y="162.0" text-anchor="middle">×15</text>
<line class="mean-hi" x1="840.0" x2="840.0" y1="124.0" y2="152.0"/>
<text class="t value" x="830.0" y="120.0" text-anchor="end">100%</text>
<text class="t label" x="234" y="227.0" text-anchor="end">Same room, a teammate drops out</text>
<line class="ci" x1="633.5" x2="820.3" y1="222.0" y2="222.0"/>
<circle class="dot" cx="250.0" cy="222.0" r="4.2"/>
<circle class="dot" cx="397.5" cy="222.0" r="4.2"/>
<circle class="dot" cx="545.0" cy="222.0" r="4.6"/>
<text class="tick" x="545.0" y="246.0" text-anchor="middle">×2</text>
<circle class="dot" cx="840.0" cy="222.0" r="6.5"/>
<text class="tick" x="840.0" y="246.0" text-anchor="middle">×11</text>
<line class="mean" x1="731.8" x2="731.8" y1="208.0" y2="236.0"/>
<text class="t value" x="741.8" y="204.0" text-anchor="start">82% (CI 65%–97%)</text>
<text class="t label" x="234" y="311.0" text-anchor="end">…plus a share-first norm</text>
<line class="ci" x1="427.0" x2="702.3" y1="306.0" y2="306.0"/>
<circle class="dot" cx="250.0" cy="306.0" r="5.4"/>
<text class="tick" x="250.0" y="330.0" text-anchor="middle">×5</text>
<circle class="dot" cx="397.5" cy="306.0" r="4.6"/>
<text class="tick" x="397.5" y="330.0" text-anchor="middle">×2</text>
<circle class="dot" cx="545.0" cy="306.0" r="4.2"/>
<circle class="dot" cx="840.0" cy="306.0" r="5.8"/>
<text class="tick" x="840.0" y="330.0" text-anchor="middle">×7</text>
<line class="mean" x1="564.7" x2="564.7" y1="292.0" y2="320.0"/>
<text class="t value" x="574.7" y="288.0" text-anchor="start">53% (CI 30%–77%)</text>
<text class="t label" x="234" y="395.0" text-anchor="end">Separate rooms</text>
<line class="ci" x1="250.0" x2="374.6" y1="390.0" y2="390.0"/>
<circle class="dot" cx="250.0" cy="390.0" r="6.7"/>
<text class="tick" x="250.0" y="414.0" text-anchor="middle">×12</text>
<circle class="dot" cx="348.5" cy="390.0" r="4.2"/>
<circle class="dot" cx="446.5" cy="390.0" r="4.2"/>
<circle class="dot" cx="741.5" cy="390.0" r="4.2"/>
<line class="mean" x1="302.4" x2="302.4" y1="376.0" y2="404.0"/>
<text class="t value" x="312.4" y="372.0" text-anchor="start">9% (CI 0%–21%)</text>
<text class="t label" x="234" y="479.0" text-anchor="end">Separate rooms, 5 rounds</text>
<line class="ci" x1="250.0" x2="354.9" y1="474.0" y2="474.0"/>
<circle class="dot" cx="250.0" cy="474.0" r="6.8"/>
<text class="tick" x="250.0" y="498.0" text-anchor="middle">×13</text>
<circle class="dot" cx="446.5" cy="474.0" r="4.2"/>
<circle class="dot" cx="643.5" cy="474.0" r="4.2"/>
<line class="mean" x1="289.3" x2="289.3" y1="460.0" y2="488.0"/>
<text class="t value" x="299.3" y="456.0" text-anchor="start">7% (CI 0%–18%)</text>
<text class="t label" x="234" y="563.0" text-anchor="end">Separate rooms, occupants visible</text>
<line class="ci" x1="250.0" x2="374.6" y1="558.0" y2="558.0"/>
<circle class="dot" cx="250.0" cy="558.0" r="6.7"/>
<text class="tick" x="250.0" y="582.0" text-anchor="middle">×12</text>
<circle class="dot" cx="348.5" cy="558.0" r="4.2"/>
<circle class="dot" cx="446.5" cy="558.0" r="4.2"/>
<circle class="dot" cx="741.5" cy="558.0" r="4.2"/>
<line class="mean" x1="302.4" x2="302.4" y1="544.0" y2="572.0"/>
<text class="t value" x="312.4" y="540.0" text-anchor="start">9% (CI 0%–21%)</text>
<text class="t label" x="234" y="647.0" text-anchor="end">No communication</text>
<line class="ci" x1="250.0" x2="354.9" y1="642.0" y2="642.0"/>
<circle class="dot" cx="250.0" cy="642.0" r="6.7"/>
<text class="tick" x="250.0" y="666.0" text-anchor="middle">×12</text>
<circle class="dot" cx="348.5" cy="642.0" r="4.2"/>
<circle class="dot" cx="446.5" cy="642.0" r="4.2"/>
<circle class="dot" cx="643.5" cy="642.0" r="4.2"/>
<line class="mean" x1="295.9" x2="295.9" y1="628.0" y2="656.0"/>
<text class="t value" x="305.9" y="624.0" text-anchor="start">8% (CI 0%–18%)</text>
<line class="axis" x1="250.0" x2="840.0" y1="692.0" y2="692.0"/>
<text class="tick" x="250.0" y="710.0" text-anchor="middle">0%</text>
<text class="tick" x="397.5" y="710.0" text-anchor="middle">25%</text>
<text class="tick" x="545.0" y="710.0" text-anchor="middle">50%</text>
<text class="tick" x="692.5" y="710.0" text-anchor="middle">75%</text>
<text class="tick" x="840.0" y="710.0" text-anchor="middle">100%</text>
<text class="tick" x="545.0" y="728.0" text-anchor="middle">answer accuracy per task instance</text>
<text class="t note" x="24" y="758.0">Across 915 deliberation turns in separate rooms, agents chose share every time and never moved, even when shown their room was empty.</text>
</svg>
